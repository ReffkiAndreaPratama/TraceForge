name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop]"
      - name: Lint
        run: |
          ruff check .
      - name: Type check
        run: |
          mypy src/traceforge
      - name: Tests
        run: |
          pytest -q
      - name: Demo fixtures
        run: |
          python scripts/generate_fixtures.py
