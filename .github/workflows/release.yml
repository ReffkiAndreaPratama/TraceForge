name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[desktop]"
      - name: Build frontend
        run: |
          cd apps/desktop
          npm ci
          npm run build
      - name: Build package
        run: |
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  # The desktop UI is a local web app served by the bridge. A native Tauri build
  # requires Rust/cargo and a C toolchain; it is not produced by this workflow.
