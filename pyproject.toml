[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "Local-first reverse engineering workbench that correlates API traffic, binary metadata, and static analysis findings into a searchable evidence graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TraceForge contributors" }]
keywords = ["reverse-engineering", "binary-analysis", "har", "api-diff", "evidence-graph", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]

dependencies = [
  "typer>=0.27.2,<0.30",
  "rich>=13.9.4,<15",
  "pydantic>=2.13.5,<3",
  "SQLAlchemy>=2.0.30,<2.1",
  "alembic>=1.13.1,<2",
  "pefile==2024.8.26",
  "pyelftools>=0.33,<0.34",
  "lief>=1.0.0,<1.1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=5.0,<8",
  "hypothesis>=6.170.5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<0.15",
  "httpx>=0.27.0,<1",
]
desktop = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9,<1",
]

[project.scripts]
traceforge = "traceforge.cli.main:run"
traceforge-bridge = "traceforge.bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/traceforge/traceforge"
Documentation = "https://github.com/traceforge/traceforge/tree/main/docs"
Issues = "https://github.com/traceforge/traceforge/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["traceforge*"]

[tool.setuptools.package-data]
traceforge = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["apps/desktop/node_modules", "apps/desktop/dist"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "S",   # bandit
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF",
]
ignore = [
  "S101", # assert allowed in tests
  "B008",
  "RUF001", # ambiguous unicode: allowed in user-facing strings
  "RUF002",
  "RUF003",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["traceforge"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
packages = ["traceforge"]
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
plugins = []
exclude = "(?x)(^apps/|^tests/)"

[[tool.mypy.overrides]]
module = ["lief.*", "pefile.*", "elftools.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "security: security-focused tests",
  "integration: end-to-end workflow tests",
  "regression: pinned-output regression tests",
  "slow: long running tests",
]
filterwarnings = ["error::DeprecationWarning:traceforge.*"]
